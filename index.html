<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTUZHNOLET VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            padding: 16px 20px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            text-align: center;
        }
        .btn-secondary {
            background-color: #475569;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.4);
        }
        .btn:hover {
            opacity: 0.9;
        }
        #toast {
            margin-top: 15px;
            color: #4ade80;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 POTUZHNOLET VPN</h2>
        <p>Выберите способ подключения:</p>
        
        <!-- Универсальная кнопка открытия -->
        <button class="btn" onclick="openApp()">
            Открыть в Happ
        </button>
        
        <!-- Запасная кнопка копирования -->
        <button class="btn btn-secondary" onclick="copyConfig()">
            Скопировать ключ
        </button>
        
        <div id="toast">Ключ скопирован в буфер!</div>
    </div>

    <script>
        const rawConfig = "hy2://fPgFo%2FTyzIMnuz01UgYqdU22@135.136.187.59:443?insecure=1&sni=bing.com&pinSHA256=11C6DB32405C1FB57F94D1961222FAC63BE34984B4F6C88D1A237559B08BDA02#POTUZHNOLET";

        function openApp() {
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // Для Android запускаем через Intent
                window.location.href = "intent://fPgFo%2FTyzIMnuz01UgYqdU22@135.136.187.59:443?insecure=1&sni=bing.com&pinSHA256=11C6DB32405C1FB57F94D1961222FAC63BE34984B4F6C88D1A237559B08BDA02#Intent;scheme=hy2;package=com.happ.proxy;end";
            } else {
                // Для iOS (и других систем) используем прямой протокол hy2://
                window.location.href = rawConfig;
            }
        }

        function copyConfig() {
            navigator.clipboard.writeText(rawConfig).then(() => {
                const toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 4000);
            });
        }
    </script>

</body>
</html>
